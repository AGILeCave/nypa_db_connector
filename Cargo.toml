[package]
name = "nypa_db_connector"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_app = "0.19"
bevy_ecs = "0.19"
triple_buffer = "9"
bytemuck = "1"
dirs = "6"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
